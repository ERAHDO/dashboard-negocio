<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inmersiva · Dashboard</title>
<style>
:root{
  --bg:#0a1628; --card:#101f38; --card2:#182a47; --border:#23406b;
  --txt:#eaf2fb; --muted:#8aa8cc; --accent:#2f9bff; --green:#34d17a; --orange:#f5a623; --pink:#ff6ec7; --purple:#9d7bff;
}
[data-theme="light"]{
  --bg:#f2f6fc; --card:#ffffff; --card2:#eef3fa; --border:#d8e2ef;
  --txt:#152238; --muted:#5b7194; --accent:#1a7ae0; --green:#1c9e5a; --orange:#c77800; --pink:#d64fa0; --purple:#7a4fd0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;padding:24px 32px 60px;transition:background .25s,color .25s}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.topbar img{height:44px;width:auto}
.theme-btn{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;transition:all .2s}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:2px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.g::before{background:var(--green)}.kpi.o::before{background:var(--orange)}.kpi.p::before{background:var(--pink)}.kpi.v::before{background:var(--purple)}
.kpi .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .note{color:var(--muted);font-size:12px;margin-top:4px}
.note .up{color:var(--green);font-weight:600}
.row{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.row{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.panel h3{font-size:14px;font-weight:600;margin-bottom:14px}
.panel h3 span{color:var(--muted);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{padding:8px 6px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
tr:hover td{background:var(--card2)}
.num{text-align:right}
.bar-cell{position:relative}
.bar-cell .bg{position:absolute;right:0;top:20%;bottom:20%;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 100%);opacity:.18;border-radius:3px}
.bar-cell .txt{position:relative;font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--card2);color:var(--muted)}
.pie-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
#pieLegend{font-size:12px;line-height:1.9}
#pieLegend .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:baseline}
svg text{fill:var(--muted);font-size:10px;font-family:inherit}
.hint{margin-top:10px;color:var(--muted);font-size:11px}
.hint b{color:var(--txt)}
</style>
</head>
<body data-theme="dark">
<div class="topbar">
  <img id="logo" src="assets/logo-white.png" alt="Inmersiva">
  <button class="theme-btn" id="themeBtn">☀️ Claro / 🌙 Oscuro</button>
</div>
<div class="sub">Dashboard de facturación · datos actualizados a Septiembre 2026</div>
<div class="grid" id="kpis"></div>

<div class="row">
  <div class="panel"><h3>Evolución mensual de facturación <span>· subtotal €</span></h3><div id="line"></div></div>
  <div class="panel"><h3>Reparto por cliente</h3>
    <div class="pie-wrap"><svg id="pie" width="150" height="150" viewBox="0 0 42 42"></svg><div id="pieLegend"></div></div>
    <div class="hint">Top 6 clientes + «Otros»</div>
  </div>
</div>

<div class="row">
  <div class="panel"><h3>Ranking de clientes <span>· facturación acumulada</span></h3>
    <table id="topTable"><thead><tr><th>#</th><th>Cliente</th><th>Fras.</th><th>Media</th><th class="num">Total</th><th>Últ. fra.</th></tr></thead><tbody></tbody></table>
  </div>
  <div class="panel"><h3>Comparativa anual <span>· subtotal €</span></h3><div id="bars"></div>
    <div class="hint" style="margin-top:16px">IRPF retenido acumulado: <b id="irpf"></b></div>
  </div>
</div>

<script>
const D = {"labels": ["Ene 24", "Feb 24", "Mar 24", "Abr 24", "May 24", "Jun 24", "Jul 24", "Ago 24", "Sep 24", "Oct 24", "Nov 24", "Dic 24", "Ene 25", "Feb 25", "Mar 25", "Abr 25", "May 25", "Jun 25", "Jul 25", "Ago 25", "Sep 25", "Oct 25", "Nov 25", "Dic 25", "Ene 26", "Feb 26", "Mar 26", "Abr 26", "May 26", "Jun 26", "Jul 26", "Ago 26", "Sep 26", "Oct 26", "Nov 26", "Dic 26"], "values": [0, 0, 0, 0, 0, 0, 2406.0, 0, 0, 0, 1420.0, 0, 0, 1371.75, 0, 0, 0, 445.5, 115.5, 2748.0, 2694.04, 859.16, 10729.74, 1215.82, 300.0, 732.71, 2805.33, 3185.89, 1739.16, 8032.14, 2448.0, 2750.48, 2215.78, 0, 0, 0], "counts": [0, 0, 0, 0, 0, 0, 2, 0, 0, 0, 2, 0, 0, 3, 0, 0, 0, 1, 2, 3, 6, 2, 4, 3, 1, 3, 7, 9, 5, 9, 4, 5, 4, 0, 0, 0], "clients": [{"name": "Grupo Dirosan Canarias SL", "sub": 15515.0, "tot": 14428.95, "n": 4, "last": "11/09/2026", "lastnum": "0076/2026", "avg": 3878.75}, {"name": "Godoy González Motor, SLU", "sub": 9884.78, "tot": 9192.84, "n": 12, "last": "04/09/2026", "lastnum": "0073/2026", "avg": 823.73}, {"name": "FLIMATUR SL", "sub": 2863.0, "tot": 2662.59, "n": 3, "last": "06/03/2026", "lastnum": "0039/2026", "avg": 954.33}, {"name": "Dilucars Automóviles, SL.", "sub": 2237.0, "tot": 2080.41, "n": 4, "last": "22/07/2026", "lastnum": "0066/2026", "avg": 559.25}, {"name": "Félix Omar Rodríguez Suárez", "sub": 2216.85, "tot": 2061.69, "n": 8, "last": "11/09/2026", "lastnum": "0075/2026", "avg": 277.11}, {"name": "Carove Gestion SL", "sub": 1914.0, "tot": 1780.04, "n": 4, "last": "15/09/2026", "lastnum": "0077/2026", "avg": 478.5}, {"name": "Vehículos Alonso Automocion SL", "sub": 1787.0, "tot": 1661.91, "n": 2, "last": "31/07/2026", "lastnum": "0067/2026", "avg": 893.5}, {"name": "Iniciativas de Valor Añadido SL", "sub": 1750.5, "tot": 1627.97, "n": 5, "last": "10/06/2026", "lastnum": "0056/2026", "avg": 350.1}, {"name": "Torino Automocion", "sub": 1495.0, "tot": 1390.35, "n": 1, "last": "26/08/2025", "lastnum": "0009/2025", "avg": 1495.0}, {"name": "Roberto Marcos Szczesnowicz Cabrera", "sub": 1470.0, "tot": 1367.1, "n": 9, "last": "07/08/2026", "lastnum": "0068/2026", "avg": 163.33}, {"name": "Carloalex Canarias SLU", "sub": 1018.5, "tot": 947.22, "n": 5, "last": "22/08/2026", "lastnum": "0072/2026", "avg": 203.7}, {"name": "Victorycars Automoción.", "sub": 956.08, "tot": 889.16, "n": 4, "last": "06/04/2026", "lastnum": "0045/2026", "avg": 239.02}, {"name": "CODIREX SL", "sub": 813.0, "tot": 756.09, "n": 1, "last": "05/07/2024", "lastnum": "0002/2024", "avg": 813.0}, {"name": "CANARIAS Y EXTRANJERO EDIFICACIONES SA", "sub": 660.0, "tot": 613.8, "n": 1, "last": "20/11/2024", "lastnum": "0005/2024", "avg": 660.0}, {"name": "Momocars 2020, SL", "sub": 659.79, "tot": 613.6, "n": 3, "last": "06/04/2026", "lastnum": "0044/2026", "avg": 219.93}, {"name": "Macaronesia Automoción", "sub": 330.5, "tot": 307.37, "n": 1, "last": "05/09/2025", "lastnum": "0014/2025", "avg": 330.5}, {"name": "Fercar Motor, S.L.U.", "sub": 330.5, "tot": 307.37, "n": 1, "last": "15/09/2025", "lastnum": "0015/2025", "avg": 330.5}, {"name": "Vegamotor Canarias SLU", "sub": 330.5, "tot": 307.37, "n": 1, "last": "18/09/2025", "lastnum": "0018/2025", "avg": 330.5}, {"name": "Ryncaravan SLU", "sub": 330.5, "tot": 307.37, "n": 1, "last": "29/10/2025", "lastnum": "0020/2025", "avg": 330.5}, {"name": "Grupo Toro 18D SL", "sub": 330.5, "tot": 307.37, "n": 1, "last": "21/12/2025", "lastnum": "0027/2025", "avg": 330.5}, {"name": "RIPLEX MAIL SL", "sub": 330.5, "tot": 307.37, "n": 1, "last": "27/03/2026", "lastnum": "0040/2026", "avg": 330.5}, {"name": "Automoviles La Herradura SLU", "sub": 330.5, "tot": 307.37, "n": 1, "last": "07/04/2026", "lastnum": "0047/2026", "avg": 330.5}, {"name": "Autos Toni", "sub": 330.5, "tot": 307.37, "n": 1, "last": "20/07/2026", "lastnum": "0065/2026", "avg": 330.5}, {"name": "Be Next Automoción SL", "sub": 330.5, "tot": 307.37, "n": 1, "last": "11/08/2026", "lastnum": "0069/2026", "avg": 330.5}], "years": [{"year": 2024, "sub": 3826.0}, {"year": 2025, "sub": 18807.76}, {"year": 2026, "sub": 25581.24}], "kpis": {"total": 48215.0, "nInvoices": 75, "nClients": 24, "avgPerClient": 2008.96, "avgPerInvoice": 642.87, "bestMonth": "Nov 25", "bestMonthVal": 10729.74, "irpf": 3375.16, "y2026": 25581.24, "y2025": 18807.76, "inv2026": 50, "inv2025": 21}};
const fmt = n => n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const fmt0 = n => Math.round(n).toLocaleString('es-ES') + ' €';

// Theme
const btn=document.getElementById('themeBtn'), logo=document.getElementById('logo');
function setTheme(t){
  document.body.dataset.theme=t;
  logo.src = t==='light' ? 'assets/logo-color.png' : 'assets/logo-white.png';
  try{localStorage.setItem('inm-theme',t)}catch(e){}
  renderCharts();
}
let saved='dark'; try{saved=localStorage.getItem('inm-theme')||'dark'}catch(e){}
btn.onclick=()=>setTheme(saved==='dark'?'light':'dark');

// KPIs
const k=D.kpis, growth=((k.y2026-k.y2025)/k.y2025*100).toFixed(0);
document.getElementById('kpis').innerHTML=[
 ['Facturación total', fmt(k.total), k.nInvoices+' facturas · '+k.nClients+' clientes',''],
 ['Facturación 2026', fmt(k.y2026), '<span class="up">+'+growth+'%</span> vs 2025 ('+fmt(k.y2025)+')','g'],
 ['Media por cliente', fmt(k.avgPerClient), 'por cliente con actividad','o'],
 ['Media por factura', fmt(k.avgPerInvoice), 'mejor mes: '+k.bestMonth+' ('+fmt0(k.bestMonthVal)+')','p'],
 ['IRPF retenido', fmt(k.irpf), 'acumulado 3 ejercicios','v'],
].map(([l,v,n,c])=>`<div class="kpi ${c}"><div class="lbl">${l}</div><div class="val">${v}</div><div class="note">${n}</div></div>`).join('');

// Line chart
let W=820,H=300,P={l:56,r:12,t:14,b:30},maxV=Math.max(...D.values)*1.1;
const pts=D.values.map((v,i)=>[P.l+ i*(W-P.l-P.r)/(D.values.length-1), P.t+(H-P.t-P.b)*(1-v/maxV)]);
function linePath(){return D.values.map((v,i)=>(i?'L':'M')+pts[i][0].toFixed(1)+','+pts[i][1].toFixed(1)).join(' ')}
function renderCharts(){
  const cs=getComputedStyle(document.body);
  const accent=cs.getPropertyValue('--accent').trim(), muted=cs.getPropertyValue('--muted').trim(),
        grid=cs.getPropertyValue('--border').trim(), txt=cs.getPropertyValue('--txt').trim();
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let g=0;g<=4;g++){const y=P.t+(H-P.t-P.b)*g/4, val=maxV*(1-g/4);
   s+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="${grid}"/>`;
   s+=`<text x="${P.l-6}" y="${y+3}" text-anchor="end">${fmt0(val)}</text>`;}
  s+=`<path d="${linePath()} L${(W-P.r)},${H-P.b} L${P.l},${H-P.b} Z" fill="${accent}" opacity=".12"/>`;
  s+=`<path d="${linePath()}" fill="none" stroke="${accent}" stroke-width="2.5" stroke-linejoin="round"/>`;
  D.values.forEach((v,i)=>{
   if(i%2==0) s+=`<text x="${pts[i][0]}" y="${H-10}" text-anchor="middle">${D.labels[i]}</text>`;
   s+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="3" fill="${cs.getPropertyValue('--bg').trim()}" stroke="${accent}" stroke-width="2"><title>${D.labels[i]}: ${fmt(v)} · ${D.counts[i]} fra.</title></circle>`;
   if(v>6000) s+=`<text x="${pts[i][0]}" y="${pts[i][1]-8}" text-anchor="middle" fill="${txt}" font-weight="600">${fmt0(v)}</text>`;
  });
  s+='</svg>';
  document.getElementById('line').innerHTML=s;

  // Pie
  const cols=[accent,cs.getPropertyValue('--green').trim(),cs.getPropertyValue('--orange').trim(),cs.getPropertyValue('--pink').trim(),cs.getPropertyValue('--purple').trim(),'#39c5cf',muted];
  const top6=D.clients.slice(0,6).map(c=>c.sub);
  const others=D.clients.slice(6).reduce((a,c)=>a+c.sub,0);
  const pieData=[...D.clients.slice(0,6).map(c=>[c.name,c.sub]),['Otros ('+(D.clients.length-6)+')',others]];
  const tot=pieData.reduce((a,d)=>a+d[1],0);
  let off=0, ps='', lg='';
  pieData.forEach((d,i)=>{
   const frac=d[1]/tot, r1=off*100, r2=(off+frac)*100, large=frac>0.5?1:0;
   ps+=`<circle r="15.9" cx="21" cy="21" fill="transparent" stroke="${cols[i]}" stroke-width="6" stroke-dasharray="${(r2-r1).toFixed(2)} ${(100-r2+r1).toFixed(2)}" stroke-dashoffset="${(-r1+25).toFixed(2)}"><title>${d[0]}: ${fmt(d[1])} (${(frac*100).toFixed(1)}%)</title></circle>`;
   lg+=`<div><span class="dot" style="background:${cols[i]}"></span>${d[0]} — <b>${(frac*100).toFixed(1)}%</b> · ${fmt0(d[1])}</div>`;
   off+=frac;
  });
  document.getElementById('pie').innerHTML=ps;
  document.getElementById('pieLegend').innerHTML=lg;

  // Year bars
  const maxY=Math.max(...D.years.map(y=>y.sub));
  let b='<svg viewBox="0 0 300 190" width="100%">';
  D.years.forEach((y,i)=>{
   const h=y.sub/maxY*140, x=30+i*95;
   b+=`<rect x="${x}" y="${150-h}" width="60" height="${h}" rx="6" fill="${cols[i]}" opacity=".9"><title>${y.year}: ${fmt(y.sub)}</title></rect>
    <text x="${x+30}" y="${145-h}" text-anchor="middle" fill="${txt}" font-weight="600" font-size="12">${fmt0(y.sub)}</text>
    <text x="${x+30}" y="168" text-anchor="middle" font-size="12">${y.year}</text>`;
  });
  document.getElementById('bars').innerHTML=b+'</svg>';
}

// Top table
document.querySelector('#topTable tbody').innerHTML=D.clients.map((c,i)=>
 `<tr><td>${i+1}</td><td>${c.name}</td><td>${c.n}</td><td>${fmt0(c.avg)}</td>
  <td class="num bar-cell"><span class="bg" style="width:${(c.sub/D.clients[0].sub*100).toFixed(1)}%"></span><span class="txt">${fmt(c.sub)}</span></td>
  <td><span class="badge">${c.last}</span></td></tr>`).join('');

document.getElementById('irpf').textContent=fmt(D.kpis.irpf);
setTheme(saved); // render inicial, cuando todo está definido
</script>
</body>
</html>
